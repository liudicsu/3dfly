[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "threedfly"
version = "0.1.0"
description = "Fruit fly connectome-driven 3D exploration and mapping"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "3dfly contributors"}
]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "pyarrow>=10.0.0",
    "pandas>=1.3.0",
    "mujoco>=3.0.0",
    "opencv-python>=4.5.0",
    "open3d>=0.17.0",
    "matplotlib>=3.4.0",
    "tqdm>=4.60.0",
    "requests>=2.25.0",
    "click>=8.0.0",
    "viser>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "mypy>=0.950",
]

[project.scripts]
threedfly = "threedfly.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["threedfly*"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
